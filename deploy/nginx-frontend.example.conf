# Snippet for serving the Vite production build (`dist/`) behind Nginx + Cloudflare Tunnel.
# Merge into your server block or include from http {}.

gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

# If your Nginx build includes ngx_brotli:
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

# Long-term cache for hashed/static assets.
location ~* \.(js|css|webp|jpg|jpeg|avif|woff2)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# Per-host PWA install metadata. iOS Safari and Android Chrome snapshot the
# manifest + apple-touch-icon at "Add to Home Screen" time (before client JS
# runs), so these are served by the backend which resolves the tenant from the
# request Host header. The Vite `public/` bundle ships static defaults as a
# fallback for the case where the backend is unreachable.
#
# Replace `http://backend_upstream` below with your FastAPI service address.
location = /manifest.webmanifest {
  proxy_pass http://backend_upstream/manifest.webmanifest;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/apple-touch-icon(?:-[\w]+)?(?:-precomposed)?\.png$ {
  proxy_pass http://backend_upstream$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/icons/icon-[\w-]+\.png$ {
  proxy_pass http://backend_upstream$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /favicon-48x48.png {
  proxy_pass http://backend_upstream/favicon-48x48.png;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /favicon.ico {
  proxy_pass http://backend_upstream/favicon.ico;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
